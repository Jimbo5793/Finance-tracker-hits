# Runs on every push and merge request: build and test backend and frontend.

stages:
  - test

backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    key:
      files:
        - backend/tests/FinanceTracker.Api.Tests/FinanceTracker.Api.Tests.csproj
        - backend/src/FinanceTracker.Api/FinanceTracker.Api.csproj
    paths:
      - .nuget/packages/
  script:
    - cd backend
    - dotnet restore
    - dotnet build --no-restore -c Release
    - dotnet test --no-build -c Release

frontend:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - cd frontend
    - flutter pub get
    - flutter analyze
    - flutter test
    - flutter build web --release

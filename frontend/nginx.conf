server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the backend container
  location /api/ {
    proxy_pass http://backend:8080;
  }

  # Single-page app: unknown paths fall back to index.html (needed once routing is added)
  location / {
    try_files $uri /index.html;
  }
}
